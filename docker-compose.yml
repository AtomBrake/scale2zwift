services:
  scale2zwift:
    image: ghcr.io/atombrake/scale2zwift:latest
    # To build from source instead: replace the line above with `build: .`
    container_name: scale2zwift
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - scale2zwift-data:/data

volumes:
  scale2zwift-data:
